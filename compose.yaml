version: '3.8'
services:


  reverse-proxy:
    image: haproxy:2.4
    restart: always
    networks:
        backend: {}
    ports:
    - "127.0.0.1:8080:8080"
    volumes:
    - ./haproxy/reverse/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:rw 

  ingress-proxy:
    image: nginx:latest
    restart: always
    network_mode: host
    volumes:
    - ./nginx/ingress/default.conf:/etc/nginx/conf.d/default.conf:rw
    - ./nginx/ingress/nginx.conf:/etc/nginx/nginx.conf:rw




  web:
    image: cr.yandex/crprnc1kqah8unjofdc9/py_app:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db 
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      backend: 
        ipv4_address: 172.20.0.5


networks:
  backend:
    driver: bridge
    ipam:
     config:
       - subnet: 172.20.0.0/24